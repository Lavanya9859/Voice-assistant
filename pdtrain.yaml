# Optional external training-job template.
# The local trainer does not load this file; see train_model.py for its CLI.

framework: sklearn
framework_version: "1.4.0"
python_version: py310
entry_point: train_model.py

# Dataset configuration (optional)
# Use dataset_id to reference an existing uploaded dataset
# dataset_id: ds_abc123xyz456
# dataset_path: /opt/ml/input/data/dataset  # Where the dataset will be mounted

# Or use a dataset name (legacy)
# dataset: my-dataset-name

# Hyperparameters
hyperparameters:
  test_size: 0.2
  max_fnr: 0.02

# Environment variables (optional)
# env:
#   MY_VAR: value

# Instance configuration (optional, auto-selected if not specified)
# instance_type: ml.g5.xlarge
# region: us-east-1
# max_runtime_seconds: 3600
# volume_size_gb: 50
